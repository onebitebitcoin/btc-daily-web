services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    # 기동 직후 alembic이 붙어야 하므로 "started"가 아니라 "healthy"를 기다린다.
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    # 호스트 nginx(daily.onebitebitcoin.com, TLS)가 이 포트로 프록시한다.
    # 80/443은 호스트 nginx가 이미 쓰고 있으므로 여기서 바인딩하지 않는다.
    ports:
      - "${WEB_PORT:-8020}:80"
    depends_on:
      - backend

volumes:
  pgdata:
