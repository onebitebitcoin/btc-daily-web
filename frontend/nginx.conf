# SNS 링크 미리보기 봇은 JS를 실행하지 않아 SPA의 정적 index.html로는 날짜별
# og:title/description/image를 줄 수 없다. 이 UA들만 백엔드가 만든 메타 전용
# HTML(app/og.py)로 보내고, 사람은 그대로 SPA를 받는다.
map $http_user_agent $is_social_bot {
    default 0;
    "~*(facebookexternalhit|Facebot|Twitterbot|Slackbot|TelegramBot|KakaoTalk|Discordbot|LinkedInBot|WhatsApp|SkypeUriPreview|Applebot|redditbot)" 1;
}

# 호스트 nginx(TLS 종단)가 이미 X-Forwarded-Proto: https를 보냈다면 그대로
# 넘긴다. 이 컨테이너로 직접(로컬 8020 등) 들어와 헤더가 비어 있을 때만
# 이 nginx 자신의 스킴(항상 http)으로 대체한다 — 없으면 og:image/og:url이
# 항상 http://로 굳어버린다(og.py가 이 헤더로 origin을 만든다).
map $http_x_forwarded_proto $proxy_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # proxy_pass에 URI를 붙이는 건 정규식 location/if 안에서 금지되므로, 여기선
    # URI만 /api/og/...로 rewrite해서 아래 기존 /api 프록시 블록이 그대로 처리하게 한다.
    location = / {
        if ($is_social_bot) {
            rewrite ^ /api/og/latest last;
        }
        try_files /index.html /index.html;
    }

    location ~ ^/d/(?<edate>[^/]+)/?$ {
        if ($is_social_bot) {
            rewrite ^ /api/og/$edate last;
        }
        try_files /index.html /index.html;
    }

    # 백엔드는 redirect_slashes=False(backend/app/main.py:9)라 경로를 손대면 안 된다.
    # proxy_pass에 경로를 붙이지 않으면 원본 URI가 그대로 전달된다.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # vite가 해시 파일명으로 뽑으므로 장기 캐시가 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — /d/:date, /calendar 직접 진입/새로고침 대응
    # (백엔드에 정적 서빙이나 catch-all이 없으므로 이게 없으면 404가 난다)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
