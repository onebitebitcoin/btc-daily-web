server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 백엔드는 redirect_slashes=False(backend/app/main.py:9)라 경로를 손대면 안 된다.
    # proxy_pass에 경로를 붙이지 않으면 원본 URI가 그대로 전달된다.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # vite가 해시 파일명으로 뽑으므로 장기 캐시가 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — /d/:date, /calendar 직접 진입/새로고침 대응
    # (백엔드에 정적 서빙이나 catch-all이 없으므로 이게 없으면 404가 난다)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
